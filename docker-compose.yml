version: '3.8'

services:
  app:
    image: mcr.microsoft.com/devcontainers/php:8.2
    volumes:
      - .:/workspace:cached
    command: sleep infinity
    networks:
      - clase-net
    depends_on:
      - db

  web:
    image: mcr.microsoft.com/devcontainers/php:8.2
    volumes:
      - ./public:/var/www/html:cached
    ports:
      - "8080:80"
    networks:
      - clase-net
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: clase
      MYSQL_USER: alumno
      MYSQL_PASSWORD: alumno123
    volumes:
      - db-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    networks:
      - clase-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: alumno
      PMA_PASSWORD: alumno123
    networks:
      - clase-net
    depends_on:
      - db

volumes:
  db-data:

networks:
  clase-net:
